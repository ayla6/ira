[workspace]
members = [
    "crates/models",
    "crates/db",
    "crates/parser",
    "crates/api",
    "crates/platforms",
    "crates/config",
    "crates/watcher",
    "crates/launcher",
    "crates/images",
    "crates/ira",
    "crates/overlay",
    "crates/overlay-ipc",
    "crates/overlay-shim",
    "crates/overlay-vk",
    "crates/input",
    "crates/input-ipc", "crates/input-ipc", "crates/overlay-ui", "crates/widgets",
]
resolver = "2"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# Dev builds recompile one giant crate on every touch (~30s) with full
# debuginfo, most of it link time. Line tables keep RUST_BACKTRACE useful
# while dropping the type/variable info that slows codegen and linking.
# No `cargo add` equivalent exists for profiles; this touches neither
# dependencies nor the lockfile.
[profile.dev]
debug = 1
