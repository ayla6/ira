[package]
name = "ira"
version = "0.1.0"
edition = "2021"
default-run = "ira"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
glib = "0.22"
gio = "0.22"
gdk4 = "0.11"
pango = "0.22"
notify = "9.0.0-rc.4"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
image = { version = "0.25", features = ["png", "ico", "jpeg", "webp"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
libc = "0.2"
xdg = "3.0.0"
shlex = "1.3"
which = "7.0"
opticaldiscs = "0.10"

[[bin]]
name = "ira"
path = "src/main.rs"

[[bin]]
name = "ira-test"
path = "src/bin/test_main.rs"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
# Good-practice restriction lints (not in clippy::all by default)
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[features]
