[package]
name = "ira"
version = "0.1.0"
edition = "2021"
default-run = "ira"

[dependencies]
chrono = "0.4"
serde_json = "1"
gtk4 = { version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
glib = "0.22"
gio = "0.22"
gdk4 = "0.11"
pango = "0.22"
libc = "0.2"
image = { version = "0.25", features = ["png", "ico", "jpeg", "webp"] }
tracing = "0.1"
ira-models = { path = "../models" }
ira-db = { path = "../db" }
ira-parser = { path = "../parser" }
ira-api = { path = "../api" }
ira-platforms = { path = "../platforms" }
ira-config = { path = "../config" }
ira-watcher = { path = "../watcher" }
ira-launcher = { path = "../launcher" }
ira-images = { path = "../images" }
ira-overlay-ipc = { path = "../overlay-ipc" }
opticaldiscs = "0.10"
tracing-subscriber = { version = "0.3", optional = true }
tracing-chrome = { version = "0.7", optional = true }
ira-input = { version = "0.1.0", path = "../input" }
[dev-dependencies]
tempfile = "3"

[[bin]]
name = "ira"
path = "src/main.rs"

[[bin]]
name = "ira-test"
path = "src/bin/test_main.rs"

[[bin]]
name = "ira-disc-info"
path = "src/bin/disc_info.rs"

[lints]
workspace = true

[features]
trace = ["dep:tracing-subscriber", "dep:tracing-chrome"]

[build-dependencies]
glib-build-tools = "0.22.8"
