[package]
name = "ira-overlay-standalone"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ira-overlay-standalone"

[[bin]]
name = "ira-overlay-test"
path = "src/test_main.rs"

[dependencies]
ira-overlay = { path = "../overlay" }
ira-overlay-ipc = { path = "../overlay-ipc" }
ash = "0.38"
libc = "0.2"
ashpd = { version = "0.13.13", features = ["screencast", "tokio"] }
pipewire = "0.10.0"
tokio = { version = "1", features = ["rt", "time"] }

[lints]
workspace = true

[build-dependencies]
pkg-config = "0.3.33"
