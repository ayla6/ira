[package]
name = "ira-parser"
version = "0.1.0"
edition = "2021"

[dependencies]
image = { version = "0.25", features = ["png", "ico", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
ira-models = { path = "../models" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
