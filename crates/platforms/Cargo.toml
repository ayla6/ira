[package]
name = "ira-platforms"
version = "0.1.0"
edition = "2021"

[dependencies]
ira-models = { path = "../models" }
ira-db = { path = "../db" }
ira-parser = { path = "../parser" }
ira-api = { path = "../api" }
ira-config = { path = "../config" }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
xdg = "3.0.0"
which = "7.0"
opticaldiscs = "0.10"
notify = "9.0.0-rc.4"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
