[package]
name = "ira-platforms"
version = "0.1.0"
edition = "2021"

[dependencies]
ira-models = { path = "../models" }
ira-db = { path = "../db" }
ira-parser = { path = "../parser" }
ira-api = { path = "../api" }
ira-config = { path = "../config" }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
xdg = "3.0.0"
which = "7.0"
opticaldiscs = "0.10"
notify = "9.0.0-rc.4"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tracing = "0.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
zstd = { version = "0.13.3", features = ["thin"] }
tar = "0.4.46"
roxmltree = "0.21.1"
md-5 = "0.10"
sevenz-rust = "0.6"
rayon = "1.12.0"
aes = "0.9.3"
sha2 = "0.11.0"
xts-mode = "^0.6"
ctr = "^0.10"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
